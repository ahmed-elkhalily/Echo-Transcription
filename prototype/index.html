<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Echo — Live Transcription Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  * { box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  ::selection { background: rgba(49,224,160,0.28); }

  /* thin custom scrollbar for the transcript feed */
  .feed-scroll::-webkit-scrollbar { width: 8px; }
  .feed-scroll::-webkit-scrollbar-track { background: transparent; }
  .feed-scroll::-webkit-scrollbar-thumb { background: #232328; border-radius: 99px; }
  .feed-scroll::-webkit-scrollbar-thumb:hover { background: #34343c; }

  @keyframes slideInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .arrive { animation: slideInUp .45s cubic-bezier(.16,1,.3,1); }

  @keyframes buzzFlash {
    0%   { background: rgba(49,224,160,0.0);  border-color: #1C1C20; }
    18%  { background: rgba(49,224,160,0.22); border-color: rgba(49,224,160,0.9); }
    100% { background: rgba(49,224,160,0.0);  border-color: #1C1C20; }
  }
  .buzz-flash { animation: buzzFlash 1.1s ease-out; }

  @keyframes recPulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.25; }
  }
  .rec-dot { animation: recPulse 1.4s ease-in-out infinite; }

  @keyframes pointPulse {
    0%   { r: 3; opacity: 1; }
    70%  { r: 9; opacity: 0; }
    100% { r: 9; opacity: 0; }
  }
  .point-ping { animation: pointPulse 1.6s ease-out infinite; }

  @keyframes wordGlow {
    0% { color: #31E0A0; text-shadow: 0 0 12px rgba(49,224,160,0.7); }
    100% { color: inherit; text-shadow: none; }
  }
  .word-glow { animation: wordGlow 1.6s ease-out forwards; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="data.jsx"></script>
  <script type="text/babel" data-presets="react" src="viz.jsx"></script>
  <script type="text/babel" data-presets="react" src="panels.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
